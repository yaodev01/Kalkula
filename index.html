<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KALKULA</title>
<style>
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#1f2a22;--mut:#6b6a5e;--bd:#e5dece;--ac:#1f6f4a;--acs:#dcebd9;--bad:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0d1411;--card:#151f1a;--ink:#e8efeb;--mut:#92a199;--bd:#25322b;--acs:#0f3a2b;--ac:#059669;--bad:#dc2626;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}

input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;width:100%}input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

.pos{color:var(--ac)}.neg{color:var(--bad)}.note{background:var(--acs);border-radius:8px;padding:10px 12px;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{color:var(--mut);font-weight:500;font-size:12px}.w{overflow-x:auto}
.bar{height:10px;border-radius:5px;background:var(--acs);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--ink);max-width:520px;width:92%}dialog::backdrop{background:#0006}
.tip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--mut);font:600 12px inherit;cursor:pointer;padding:0;margin-left:5px;vertical-align:middle}.step{display:flex;gap:10px;align-items:center;padding:5px 0}.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:12px;flex:none}.chk.ok{background:var(--ac);border-color:var(--ac);color:#fff}header{position:sticky}
body{max-width:520px;margin:0 auto;border-inline:1px solid var(--bd);-webkit-tap-highlight-color:transparent}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}.tag{display:none}header .tip{position:static!important}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);gap:0;overflow:visible;margin:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;border:0;border-bottom:0}#nav button.on{border-color:transparent}
main{padding-bottom:110px}.card{border-radius:16px}button:active{transform:scale(.97)}.ctr button{width:44px;height:44px;border-radius:14px}
.hero{background:var(--ac);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}.hero .lbl{color:#ffffffcc}.hb{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.2}.hero .tip{background:#ffffff33;color:#fff;border-color:#ffffff66}
dialog[open]{margin:auto auto 0;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes grow{from{transform:scaleY(0)}}@keyframes sheet{from{opacity:0;transform:translateY(40px)}}@keyframes fade{from{opacity:0}}
.enter>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}.enter>:nth-child(2){animation-delay:.05s}.enter>:nth-child(3){animation-delay:.1s}.enter>:nth-child(4){animation-delay:.15s}.enter>:nth-child(n+5){animation-delay:.2s}
dialog[open]{animation:sheet .28s cubic-bezier(.2,.8,.2,1)}dialog::backdrop{animation:fade .25s}
.wk{display:flex;gap:6px;align-items:flex-end;height:46px;margin-top:16px}.wk i{flex:1;background:#ffffff59;border-radius:5px}.wk i.t{background:#fff}.enter .wk i{transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms+.15s)}
#nav button svg{padding:4px 18px;box-sizing:content-box;border-radius:14px;transition:background .25s}#nav button.on svg{background:var(--acs)}#nav button.on{font-weight:700}
.av{width:42px;height:42px;border-radius:13px;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:800;font-size:17px}.sale{grid-template-columns:auto 1fr auto}.hb{font-size:34px}
header{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;max-width:92%;font-size:13px}#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{background:none;border:0;color:var(--acs);font:inherit;font-weight:700;cursor:pointer;padding:0}

@media print{header,#nav,button,.tip,dialog,#toast{display:none!important}body{border:0;max-width:none;background:#fff}main{padding-bottom:0}}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0;padding-bottom:0}.item:first-child{padding-top:0}.acts{display:flex;flex-direction:column;gap:6px}.chip{display:inline-block;background:var(--acs);color:var(--ac);border-radius:8px;padding:1px 9px;font-size:12px;font-weight:600;margin-top:5px}
.xf{display:grid;gap:12px;border-color:var(--ac)}.xf b{font-size:15px}.xfer{display:grid;grid-template-columns:1fr 1fr;gap:10px}.xfer .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}.xfer svg{width:18px;height:18px}dialog h3{margin-top:0}main>h2{margin-top:4px}
</style></head><body>
<header><div><div class="logo">KALKULA</div><div class="lbl" id="bn"></div></div><div class="tag">Ketahui modalmu. Kembangkan usahamu.</div><span style="display:flex;gap:8px"><button class="tip" style="margin:0;width:auto;padding:0 12px;height:30px;border-radius:15px" onclick="themeT()">Tema</button><button class="tip" style="margin:0;width:auto;padding:0 12px;height:30px;border-radius:15px" onclick="wsDlg()">Usaha</button><button class="tip" style="margin:0;width:auto;padding:0 12px;height:30px;border-radius:15px" onclick="help()" aria-label="Bantuan">?</button></span></header>
<main id="main"></main><nav id="nav" aria-label="Menu utama"></nav><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),R=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),pc=n=>isFinite(n)?n.toFixed(1).replace('.',',')+'%':'–',uid=()=>Math.random().toString(36).slice(2,8);
const day=o=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4-(o||0)*864e5).toISOString().slice(0,10),today=()=>day(0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UN={kg:['g',1000],g:['g',1],mg:['g',.001],ons:['g',100],liter:['ml',1000],ml:['ml',1],m:['cm',100],cm:['cm',1],pcs:['pcs',1],buah:['pcs',1],butir:['pcs',1],lusin:['pcs',12],kodi:['pcs',20]},F=u=>UN[u]?UN[u][1]:1,BU=u=>UN[u]?UN[u][0]:u,compat=u=>UN[u]?Object.keys(UN).filter(k=>UN[k][0]==UN[u][0]):[u];
const K={cost(p,mats,ov){let m=0;p.ings.forEach(i=>{const x=(mats||S.mats).find(y=>y.id==i.mid);if(x){const pr=ov&&ov[x.id]!=null?ov[x.id]:x.price;m+=Math.round(pr*i.qty*F(i.u||x.unit)/(x.qty*F(x.unit)))}});const tot=m+p.other,good=Math.max(1,Math.floor(p.batch*(1-p.waste/100)));return{mat:m,tot,good,hpp:Math.ceil(tot/good)}},
rec(hpp){const d=1-S.target/100-S.fee/100;return d>0?Math.ceil(hpp/d/500)*500:NaN}};
K.costAt=(p,d)=>{const ov={};S.mats.forEach(m=>{const h=(m.hist||[]).filter(x=>x.d<=d).pop();ov[m.id]=h?h.p:(m.hist&&m.hist[0]?m.hist[0].p:m.price)});return K.cost(p,null,ov)};
function seed(){const M=[['m1','Biji kopi','g',1000,120000],['m2','Susu segar','ml',1000,18000],['m3','Sirup gula','ml',1000,30000],['m4','Gelas','pcs',50,40000],['m5','Tutup gelas','pcs',50,25000]].map(([id,name,unit,qty,price])=>({id,name,unit,qty,price,hist:[{d:today(),p:price}]}));
const P=[{id:'p1',name:'Es Kopi Susu',batch:20,waste:5,other:60000,price:25000,ings:[{mid:'m1',qty:360},{mid:'m2',qty:3000},{mid:'m3',qty:300},{mid:'m4',qty:20},{mid:'m5',qty:20}]},{id:'p2',name:'Americano',batch:20,waste:5,other:45000,price:20000,ings:[{mid:'m1',qty:360},{mid:'m4',qty:20},{mid:'m5',qty:20}]}];
const s={mats:M,prods:P,sales:[],fixed:[{id:'f1',name:'Sewa tempat',amt:3000000},{id:'f2',name:'Gaji',amt:6000000},{id:'f3',name:'Listrik & aplikasi',amt:1200000}],capital:72000000,target:30,fee:0};
for(let k=1;k<Number(today().slice(8));k++)P.forEach((p,i)=>s.sales.push({d:day(k),pid:p.id,u:18+((k*7+i*5)%14),price:p.price,cogs:K.cost(p,M).hpp}));return s}
const WSK='kalkula-ws',key=id=>id=='main'?'kalkula2':'kalkula2-'+id;let W;try{W=JSON.parse(localStorage.getItem(WSK))}catch(e){}if(!W||!W.list)W={cur:'main',list:[{id:'main',name:'Usaha saya'}]};let S;try{S=JSON.parse(localStorage.getItem(key(W.cur)))}catch(e){}
if(!S)S=seed();
const save=()=>{try{localStorage.setItem(key(W.cur),JSON.stringify(S));localStorage.setItem(WSK,JSON.stringify(W))}catch(e){}};
const svg=p=>`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`,V={cur:'home',pid:null},nav=[['home','Beranda',svg('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>')],['mat','Bahan',svg('<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>')],['prod','Produk',svg('<path d="M3 12l9-9h8v8l-9 9z"/><circle cx="16" cy="8" r="1.5"/>')],['fix','Biaya',svg('<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/>')],['log','Riwayat',svg('<path d="M4 6h16M4 12h16M4 18h10"/>')]];
function enter(){const m=$('#main');m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter');clearTimeout(enter.t);enter.t=setTimeout(()=>m.classList.remove('enter'),1000);scrollTo(0,0)}
const PREV={},cn=(k,v)=>`<span class="cn" data-k="${k}" data-v="${v}">${R(PREV[k]!=null?PREV[k]:0)}</span>`;
function anim(){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;document.querySelectorAll('.cn').forEach(e=>{const k=e.dataset.k,to=+e.dataset.v,from=PREV[k]!=null?PREV[k]:0;PREV[k]=to;if(from==to||rm){e.textContent=R(to);return}const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/600);e.textContent=R(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
function toast(t,u){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.innerHTML=`<span>${t}</span>`+(u?`<button onclick="${u};$('#toast').classList.remove('show')">Batal</button>`:'');e.classList.remove('show');void e.offsetWidth;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2800)}
const dim=()=>new Date(+today().slice(0,4),+today().slice(5,7),0).getDate(),nm=s=>(S.prods.find(p=>p.id==s.pid)||{name:'(dihapus)'}).name,TX='width:100%;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:8px;padding:8px';
const per=(s,v)=>v=='w'?s.d>=day(6):v=='y'?s.d.startsWith(today().slice(0,4)):v=='a'?true:s.d.startsWith(v),blank=()=>({mats:[],prods:[{id:uid(),name:'Produk 1',batch:10,waste:0,other:0,price:0,ings:[]}],sales:[],fixed:[],capital:0,target:30,fee:0});
function pdf(){try{window.print()}catch(e){alert('Gunakan menu cetak di browser, lalu pilih Simpan sebagai PDF.')}}
function wsDlg(){mod(`<h3>Usaha saya</h3>${W.list.map(b=>`<div class="sale" style="grid-template-columns:1fr auto"><b>${esc(b.name)}</b><span>${b.id==W.cur?'<span class="lbl">Aktif</span>':`<button class="btn s" onclick="switchW('${b.id}')">Pakai</button> <button class="btn g s x" onclick="delW('${b.id}')">Hapus</button>`}</span></div>`).join('')}<div class="row" style="margin-top:10px"><div><label>Nama usaha baru</label><input id="wn" placeholder="Toko Kue"></div><button class="btn" onclick="addW()">Buat usaha</button></div><div class="row"><div><label>Ganti nama usaha ini</label><input id="wr" value="${esc(W.list.find(b=>b.id==W.cur).name)}"></div><button class="btn g" onclick="renW()">Simpan nama</button></div><button class="btn g" onclick="shut()">Tutup</button>`)}
function switchW(id){save();W.cur=id;let d=null;try{d=JSON.parse(localStorage.getItem(key(id)))}catch(e){}S=d||blank();V.pid=S.prods[0].id;V.cur='home';shut();draw();enter()}
function addW(){const n=$('#wn').value.trim();if(!n)return alert('Isi nama usaha.');save();const id=uid();W.list.push({id,name:n});W.cur=id;S=blank();V.pid=S.prods[0].id;V.cur='home';shut();draw();enter();toast('Usaha baru dibuat')}
function renW(){const n=$('#wr').value.trim();if(!n)return;W.list.find(b=>b.id==W.cur).name=n;shut();draw()}
function delW(id){if(!confirm('Hapus usaha ini beserta semua datanya?'))return;W.list=W.list.filter(b=>b.id!=id);try{localStorage.removeItem(key(id))}catch(e){}draw();wsDlg()}
const xf=k=>`<div class="card xf"><div><b>Ekspor & impor ${k=='mat'?'bahan':'produk'}</b><div class="lbl">Pindah ke perangkat lain atau simpan salinan. Ekspor menghasilkan teks, impor menempelkannya.</div></div><div class="xfer"><button class="btn g" onclick="exportData('${k}')">${svg('<path d="M12 15V3M7 8l5-5 5 5M5 21h14"/>')}Ekspor</button><button class="btn" onclick="importData('${k}')">${svg('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>')}Impor</button></div></div>`;
function exportData(k){const o=k=='mat'?{type:'kalkula-bahan',mats:S.mats}:{type:'kalkula-produk',mats:S.mats.filter(m=>S.prods.some(p=>p.ings.some(i=>i.mid==m.id))),prods:S.prods};mod(`<h3>Ekspor ${k=='mat'?'bahan':'produk'}</h3><p class="lbl">Salin teks ini, lalu tempel di menu Impor pada perangkat lain.</p><textarea id="tx" rows="8" readonly style="${TX}">${esc(JSON.stringify(o))}</textarea><br><br><button class="btn" onclick="copyTx()">Salin</button> <button class="btn g" onclick="shut()">Tutup</button>`)}
function importData(k){mod(`<h3>Impor ${k=='mat'?'bahan':'produk'}</h3><p class="lbl">${k=='mat'?'Tempel teks hasil ekspor, atau daftar CSV dengan kolom: nama, satuan, jumlah, harga.':'Tempel teks hasil ekspor produk. Bahan yang dipakai ikut masuk.'} Data yang sudah ada tidak dihapus. Bahan dengan nama dan satuan yang sama memakai harga yang sudah ada.</p><textarea id="tx" rows="8" style="${TX}"></textarea><br><br><button class="btn" onclick="doImport('${k}')">Impor</button> <button class="btn g" onclick="shut()">Batal</button>`)}
function parseMats(t){t=t.trim();if(t[0]=='{'||t[0]=='['){const d=JSON.parse(t);return{mats:Array.isArray(d)?d:d.mats||[],prods:d.prods||[]}}const mats=[];t.split(/\r?\n/).forEach(l=>{const c=l.split(/[,;\t]/).map(x=>x.trim());if(c.length<4)return;const q=+c[2],p=+c[3].replace(/\.(?=\d{3}\b)/g,'').replace(/[^\d.]/g,'');if(c[0]&&q>0&&p>0)mats.push({name:c[0],unit:c[1]||'pcs',qty:q,price:p})});return{mats,prods:[]}}
function doImport(k){let r;try{r=parseMats($('#tx').value)}catch(e){return alert('Teks tidak valid. Pastikan seluruh teks tersalin.')}const map={};let nm_=0,np=0;(r.mats||[]).forEach(m=>{if(!m||!m.name||!(m.qty>0)||!(m.price>0))return;const ex=S.mats.find(x=>x.name.toLowerCase()==String(m.name).toLowerCase()&&x.unit==m.unit);if(ex){if(m.id)map[m.id]=ex.id;return}const n={id:uid(),name:String(m.name),unit:String(m.unit||'pcs'),qty:+m.qty,price:+m.price,hist:[{d:today(),p:+m.price}]};S.mats.push(n);if(m.id)map[m.id]=n.id;nm_++});if(k=='prod')(r.prods||[]).forEach(p=>{if(!p||!p.name||!Array.isArray(p.ings))return;const ex=S.prods.some(x=>x.name.toLowerCase()==String(p.name).toLowerCase());S.prods.push({id:uid(),name:String(p.name)+(ex?' (impor)':''),batch:Math.max(1,+p.batch||1),waste:+p.waste||0,other:+p.other||0,price:+p.price||0,ings:p.ings.filter(i=>map[i.mid]).map(i=>({mid:map[i.mid],qty:+i.qty||0,u:i.u}))});np++});if(!nm_&&!np)return alert('Tidak ada data baru yang bisa diimpor.');shut();draw();toast('Masuk: '+nm_+' bahan'+(k=='prod'?', '+np+' produk':''))}
function addLog(){const d=$('#ld').value,p=P($('#lp').value),u=Math.floor(+$('#lu').value);if(!d||d>today()||!(u>0))return alert('Isi tanggal (tidak lebih dari hari ini) dan jumlah porsi lebih dari 0.');const s=S.sales.find(x=>x.d==d&&x.pid==p.id);if(s)s.u+=u;else S.sales.push({id:uid(),d,pid:p.id,u,price:p.price,cogs:K.costAt(p,d).hpp});V.lm=d.slice(0,7);draw();toast('Catatan tersimpan')}
function editLog(id,v){const s=S.sales.find(x=>x.id==id);v=Math.floor(+v);if(s&&v>0)s.u=v;draw()}
function delLog(id){if(confirm('Hapus catatan ini?')){S.sales=S.sales.filter(s=>s.id!=id);draw()}}

function applyMat(id){const v=+$('#np').value,m=S.mats.find(x=>x.id==id);if(v<=0)return alert('Harga harus lebih dari 0.');m.price=v;m.hist.push({d:today(),p:v});shut();draw()}
function addProd(){const n=prompt('Nama produk?');if(!n)return;const p={id:uid(),name:n,batch:10,waste:0,other:0,price:0,ings:[]};S.prods.push(p);V.pid=p.id;draw()}
function delProd(){if(S.prods.length>1&&confirm('Hapus produk ini? Penjualan yang sudah tercatat tetap ada.')){S.prods=S.prods.filter(p=>p.id!=P().id);V.pid=S.prods[0].id;draw()}}
function setP(k,v){P()[k]=Math.max(0,+v||0);if(k=='batch')P().batch=Math.max(1,P().batch);draw()}
function addIng(){const q=+$('#iq').value;if(!(q>0))return alert('Isi jumlah lebih dari 0.');P().ings.push({mid:$('#im').value,qty:q,u:$('#iu').value});draw()}
function addFix(){const n=$('#fn').value.trim(),a=+$('#fa').value;if(!n||a<=0)return alert('Isi nama dan jumlah (lebih dari 0).');S.fixed.push({id:uid(),name:n,amt:a});draw()}
V.pid=S.prods[0]&&S.prods[0].id;draw();enter();
</script></body></html>
